{% extends 'base.html' %}
{% block content %}
<section class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <h2 class="h5 fw-bold mb-4">할 일 수정</h2>
        <form action="/edit/{{ todo.id }}" method="post">
            <label for="task" class="form-label">할 일</label>
            <textarea class="form-control" name="task" id="task" rows="4" required>{{ todo.task }}</textarea>
            <div class="form-check form-switch mt-3">
                <input class="form-check-input" type="checkbox" role="switch" name="completed" id="completed" value="true"{% if todo.completed %} checked{% endif %}>
                <label class="form-check-label" for="completed">완료한 할 일</label>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="/" class="btn btn-outline-secondary">취소</a>
                <button type="submit" class="btn btn-primary">저장하기</button>
            </div>
        </form>
    </div>
</section>
{% endblock content %}
